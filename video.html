<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8e0d0;line-height:1.7;overflow-x:hidden}

h1,h2,h3,h4{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:0.02em}
a{color:#c9a84c;text-decoration:none;transition:color 0.3s}
a:hover{color:#f0d060}

/* Navbar */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,10,15,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,0.15);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:1.2rem;color:#c9a84c;text-decoration:none}
.nav-logo svg{width:28px;height:28px;fill:#c9a84c}
.nav-links{display:flex;gap:4px;list-style:none;align-items:center}
.nav-links a{color:#7a6c5a;text-decoration:none;font-size:0.78rem;font-weight:500;padding:6px 12px;border-radius:6px;transition:all 0.3s;letter-spacing:0.5px;text-transform:uppercase;white-space:nowrap}
.nav-links a:hover{color:#f0d060;background:rgba(201,168,76,0.08)}
.nav-links a.active{color:#c9a84c;background:rgba(201,168,76,0.12)}
.nav-toggle{display:none;background:none;border:none;color:#c9a84c;font-size:1.5rem;cursor:pointer;padding:8px}

/* Layout */
.page-container{padding:84px 24px 40px;max-width:1100px;margin:0 auto}

/* Breadcrumb */
.breadcrumb{font-size:0.78rem;color:#5a4c3a;margin-bottom:20px}
.breadcrumb a{color:#7a6c5a}
.breadcrumb a:hover{color:#c9a84c}
.breadcrumb span{color:#3a2c1a;margin:0 6px}

/* Player section */
.player-section{background:#111;border-radius:16px;overflow:hidden;border:1px solid rgba(201,168,76,0.1);margin-bottom:24px}
.player-container{position:relative;width:100%;padding-bottom:56.25%;background:#050508}
.player-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.player-scanlines{position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}

/* Video info */
.video-info{padding:24px 28px}
.video-info h1{font-size:clamp(1.2rem,2.5vw,1.7rem);color:#e8e0d0;margin-bottom:12px;line-height:1.3}
.video-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.video-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.video-date{font-size:0.8rem;color:#5a4c3a}
.video-prog-id{font-size:0.7rem;color:#3a2c1a;background:rgba(255,255,255,0.03);padding:3px 10px;border-radius:10px}
.video-desc{font-size:0.92rem;color:#a09080;line-height:1.8;border-top:1px solid rgba(201,168,76,0.06);padding-top:16px}

/* Program sidebar */
.content-grid{display:grid;grid-template-columns:1fr 300px;gap:24px}
.program-card{background:rgba(26,10,46,0.2);border:1px solid rgba(201,168,76,0.08);border-radius:14px;padding:20px;height:fit-content}
.program-card h3{font-size:0.85rem;color:#c9a84c;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-family:'Inter',sans-serif}
.program-card p{font-size:0.82rem;color:#7a6c5a;line-height:1.7}
.program-card .prog-stats{font-size:0.72rem;color:#5a4c3a;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.04)}

/* Tags */
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.65rem;background:rgba(201,168,76,0.06);color:#7a6c5a;border:1px solid rgba(201,168,76,0.08)}

/* Actions */
.video-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.action-btn{padding:8px 20px;border-radius:50px;border:1px solid rgba(201,168,76,0.2);background:rgba(201,168,76,0.05);color:#c9a84c;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.3s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.action-btn:hover{background:rgba(201,168,76,0.12);border-color:rgba(201,168,76,0.4);transform:translateY(-1px)}
.action-btn-secondary{background:rgba(255,255,255,0.04);color:#7a6c5a;border-color:rgba(255,255,255,0.08)}
.action-btn-secondary:hover{background:rgba(255,255,255,0.07);color:#a09080}

/* Related videos */
.related-section{margin-top:32px}
.related-section h2{font-size:1.1rem;color:#c9a84c;margin-bottom:16px;font-family:'Inter',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.related-card{background:rgba(26,10,46,0.2);border:1px solid rgba(201,168,76,0.06);border-radius:12px;overflow:hidden;cursor:pointer;transition:all 0.35s cubic-bezier(0.22,1,0.36,1)}

.related-card .rel-thumb{position:relative;width:100%;padding-bottom:56.25%;background:#050508}
.related-card .rel-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
.related-card:hover .rel-thumb img{transform:scale(1.05)}
.related-card .rel-info{padding:10px 12px 12px}
.related-card .rel-info h4{font-family:'Inter',sans-serif;font-size:0.8rem;font-weight:600;color:#d0c8b0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.related-card .rel-badge{font-size:0.6rem;padding:1px 8px;border-radius:12px;display:inline-block;font-weight:500}

/* Empty / loading state */
.loading-state{text-align:center;padding:80px 24px}
.loading-state svg{width:60px;height:60px;fill:#c9a84c;opacity:0.3;animation:idlePulse 2s ease-in-out infinite}
.loading-state h2{color:#7a6c5a;font-size:1.2rem;margin-top:12px}
.loading-state p{color:#3a2c1a;font-size:0.9rem;margin-top:6px}
@keyframes idlePulse{0%,100%{opacity:0.3}50%{opacity:0.1}}

.not-found{padding:100px 24px;text-align:center}
.not-found h2{color:#7a6c5a;font-size:1.4rem}
.not-found p{color:#3a2c1a;margin-top:8px}

footer{text-align:center;padding:40px 24px 24px;border-top:1px solid rgba(201,168,76,0.06)}
footer p{color:#5a4c3a;font-size:0.85rem;margin-bottom:4px}
footer .footer-tagline{font-family:'Playfair Display',serif;font-style:italic;color:#7a6c5a;font-size:0.95rem;margin:8px 0}

@media(max-width:768px){
  .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:rgba(10,10,15,0.96);backdrop-filter:blur(12px);flex-direction:column;padding:16px;border-bottom:1px solid rgba(201,168,76,0.15);gap:4px}

  .nav-toggle{display:block}

  .page-container{padding:76px 12px 24px}
  .video-info{padding:16px 18px}
  .content-grid{grid-template-columns:1fr}
  .related-grid{grid-template-columns:repeat(2,1fr)}

@media(max-width:480px){

</style>

  const loading = document.getElementById('loadingState');

    document.title = 'Canal Infinito — Video no encontrado';
    return;
  }

  document.title = v.title+' — Canal Infinito';
  const pc = progColorsMap[v.progId] || '#c9a84c';
  const pi = programInfo[v.progId];
  const sameProg = catalog.filter(x => x.id !== id && x.progId === v.progId);
  const others = catalog.filter(x => x.id !== id && x.progId !== v.progId);
  const related = [...sameProg, ...others].slice(0, 6);

  // Update browser URL without reload
  if(window.history.replaceState){
    window.history.replaceState({videoId:id}, '', '?id='+id);
  }

  app.innerHTML =
    '<div class="breadcrumb"><a href="videoteca.html">Videoteca</a><span>›</span><span style="color:#7a6c5a">'+v.title+'</span></div>'+

      '</div>'+
      '<div class="video-info">'+
        '<h1>'+v.title+'</h1>'+
        '<div class="video-meta">'+
          '<span class="video-badge" style="background:'+pc+'22;color:'+pc+';border:1px solid '+pc+'44">'+v.programa+'</span>'+
          '<span class="video-date">'+fmtDate(v.pub)+'</span>'+
          '<span class="video-prog-id">ID: '+v.progId+'</span>'+
        '</div>'+
        '<div class="content-grid">'+
          '<div>'+
            '<p class="video-desc">'+v.desc+'</p>'+
            '<div class="tags">'+
              v.tags.map(t => '<span class="tag">#'+t+'</span>').join('')+
            '</div>'+
            '<div class="video-actions">'+
              '<a href="videoteca.html" class="action-btn action-btn-secondary">← Videoteca</a>'+
              '<a href="tv.html" class="action-btn">📺 Ver en TV Channel</a>'+
              '<button class="action-btn action-btn-secondary" onclick="copyLink()" id="copyBtn">🔗 Copiar enlace</button>'+
            '</div>'+
          '</div>'+
          '<div class="program-card">'+
            '<h3 style="color:'+pc+'">'+v.programa+'</h3>'+
            '<p>'+(pi ? pi.desc : 'Programa de Canal Infinito.')+'</p>'+
            '<div class="prog-stats">'+
              (sameProg.length+1)+' video'+(sameProg.length > 0 ? 's' : '')+' en este programa'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="related-section">'+
      '<h2>Más videos'+(sameProg.length > 0 ? ' de <span style="color:'+pc+'">'+v.programa+'</span>' : '')+'</h2>'+
      '<div class="related-grid">'+
        related.map(rv => {
          const rpc = progColorsMap[rv.progId] || '#c9a84c';
          return '<div class="related-card" onclick="window.location.href=\'video.html?id='+rv.id+'\'">'+
            '<div class="rel-thumb"><img src="'+ytThumb(rv.id,320)+'" alt="" loading="lazy" onerror="this.src=\'https://img.youtube.com/vi/'+rv.id+'/hqdefault.jpg\'"></div>'+
            '<div class="rel-info">'+
              '<h4>'+rv.title+'</h4>'+
              '<span class="rel-badge" style="background:'+rpc+'22;color:'+rpc+';border:1px solid '+rpc+'44">'+rv.programa+'</span>'+
            '</div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>';

  loading.style.display = 'none';
}

function copyLink(){
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(()=>{
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ Copiado';
    setTimeout(() => btn.textContent = '🔗 Copiar enlace', 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

// ── Init ──
const params = new URLSearchParams(window.location.search);
const videoId = params.get('id');
if(videoId){ renderVideo(videoId); }
else {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('app').innerHTML =
    '<div class="not-found"><h2>Video no especificado</h2><p>Usa el enlace directo desde la Videoteca.</p><a href="videoteca.html" class="action-btn" style="display:inline-flex;margin-top:20px">← Volver a la Videoteca</a></div>';
}

// ── Nav ──
document.querySelector('.nav-toggle')?.addEventListener('click',function(){document.querySelector('.nav-links').classList.toggle('open')});
document.querySelectorAll('.nav-links a').forEach(a=>a.addEventListener('click',()=>{document.querySelector('.nav-links')?.classList.remove('open')}));
</script>
